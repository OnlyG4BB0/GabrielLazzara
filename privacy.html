<!DOCTYPE html>
<html lang="it" class="neo-brutal" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="description" content="Informativa privacy GDPR di Gabriel Lazzara — web developer a Palermo.">
    <link rel="canonical" href="https://onlyg4bb0.github.io/GabrielLazzara/privacy.html">
    <title>Informativa privacy | Gabriel Lazzara</title>
    <link rel="stylesheet" href="./css/main.css?v=23">
    <link rel="stylesheet" href="./css/legal.css?v=24">
    <script>
        (function () {
            const saved = localStorage.getItem('portfolio_theme');
            const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
            document.documentElement.setAttribute('data-theme', saved || (prefersLight ? 'light' : 'dark'));
        })();
    </script>
</head>
<body class="site-body legal-page" data-legal-page="privacy">
    <header class="legal-header">
        <div class="site-shell legal-header__inner">
            <a href="./" class="legal-back">← Portfolio</a>
            <div class="legal-lang" role="group" aria-label="Lingua">
                <button type="button" data-legal-lang="it" class="is-active" aria-pressed="true">IT</button>
                <button type="button" data-legal-lang="en" aria-pressed="false">EN</button>
            </div>
        </div>
    </header>
    <main class="legal-main site-shell">
        <article id="legal-content" class="legal-article glass-panel">
            <h1 id="legal-title">Informativa sulla privacy</h1>
            <p id="legal-updated" class="legal-updated">Ultimo aggiornamento: 14 giugno 2026</p>
        </article>
    </main>
    <footer class="legal-footer site-shell">
        <nav aria-label="Documenti legali">
            <a href="./privacy.html">Privacy</a>
            <a href="./cookie.html">Cookie</a>
            <a href="./note-legali.html">Note legali</a>
            <a href="./">Home</a>
        </nav>
        <p class="text-gray-500 text-sm">© 2026 Gabriel Lazzara</p>
    </footer>

    <div id="cookie-consent" class="glass-panel" role="dialog" aria-labelledby="cookie-consent-title" aria-hidden="true" hidden>
        <p id="cookie-consent-title" class="cookie-consent__title">Cookie e privacy</p>
        <p class="cookie-consent__text">Usiamo storage locale per lingua/tema e, solo se accetti, statistiche anonime. <a href="./cookie.html">Cookie policy</a> · <a href="./privacy.html">Privacy</a></p>
        <div class="cookie-consent__actions">
            <button type="button" class="cookie-consent__btn cookie-consent__btn--primary" data-consent-accept>Accetta tutto</button>
            <button type="button" class="cookie-consent__btn cookie-consent__btn--ghost" data-consent-necessary>Solo necessari</button>
            <button type="button" class="cookie-consent__btn cookie-consent__btn--ghost" data-consent-reject>Rifiuta analytics</button>
        </div>
    </div>

    <script src="./js/site-config.js"></script>
    <script src="./js/legal-content.js"></script>
    <script src="./js/consent.js?v=24" defer></script>
    <script src="./js/legal-page.js" defer></script>
</body>
</html>
