<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Liquid Cube 3D simulation preview">
  <defs>
    <linearGradient id="lc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d061a"/>
      <stop offset="50%" stop-color="#1a0b36"/>
      <stop offset="100%" stop-color="#090d24"/>
    </linearGradient>
    <radialGradient id="lc-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090d24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="face-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="face-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="liquid-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#lc-bg)"/>
  <rect width="800" height="450" fill="url(#lc-aura)"/>

  <!-- Perspective floor grid -->
  <g stroke="#a855f7" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="0" y1="425" x2="800" y2="425"/>
    <line x1="400" y1="240" x2="80" y2="450"/>
    <line x1="400" y1="240" x2="240" y2="450"/>
    <line x1="400" y1="240" x2="400" y2="450"/>
    <line x1="400" y1="240" x2="560" y2="450"/>
    <line x1="400" y1="240" x2="720" y2="450"/>
  </g>

  <!-- Orbital rings -->
  <ellipse cx="400" cy="235" rx="235" ry="68" fill="none" stroke="#e879f9" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="6 8" transform="rotate(-12 400 235)"/>
  <ellipse cx="400" cy="235" rx="195" ry="52" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" transform="rotate(14 400 235)"/>

  <!-- Outer wireframe cube -->
  <g stroke="#f5d0fe" stroke-opacity="0.25" stroke-width="1.2" fill="none">
    <polygon points="400,72 542,154 400,236 258,154"/>
    <polygon points="258,154 400,236 400,382 258,300"/>
    <polygon points="542,154 400,236 400,382 542,300"/>
  </g>

  <!-- Inner isometric glass & liquid cube -->
  <g>
    <!-- Back internal liquid volume -->
    <polygon points="400,148 516,214 400,280 284,214" fill="url(#liquid-wave)"/>
    <!-- Left liquid face -->
    <polygon points="284,214 400,280 400,356 284,290" fill="url(#face-left)"/>
    <!-- Right liquid face -->
    <polygon points="516,214 400,280 400,356 516,290" fill="url(#face-right)"/>
    <!-- Translucent top cap -->
    <polygon points="400,98 516,164 400,230 284,164" fill="url(#face-top)" opacity="0.55"/>
    <!-- Specular edges -->
    <polyline points="284,164 400,230 516,164" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
    <line x1="400" y1="230" x2="400" y2="356" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <polygon points="400,98 516,164 516,290 400,356 284,290 284,164" fill="none" stroke="#f0abfc" stroke-opacity="0.65" stroke-width="1.5"/>
  </g>

  <!-- Floating satellite shards -->
  <polygon points="186,168 206,152 214,180" fill="#e879f9" opacity="0.8"/>
  <polygon points="602,190 628,176 618,206" fill="#38bdf8" opacity="0.85"/>
  <circle cx="235" cy="295" r="4" fill="#f0abfc"/>
  <circle cx="575" cy="135" r="3.5" fill="#38bdf8"/>

  <!-- Telemetry HUD -->
  <g transform="translate(36, 32)">
    <rect width="196" height="58" rx="12" fill="#090612" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="20" cy="22" r="4" fill="#22d3ee"/>
    <text x="32" y="25" fill="#f3efe9" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1.4">WEBGL · 60 FPS</text>
    <text x="20" y="44" fill="#c4b5fd" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">FLUID MESH · GLSL</text>
  </g>
</svg>
