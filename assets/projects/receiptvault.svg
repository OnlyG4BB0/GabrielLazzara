<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="ReceiptVault mobile app preview">
  <defs>
    <linearGradient id="rv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#041f18"/>
      <stop offset="55%" stop-color="#062e24"/>
      <stop offset="100%" stop-color="#031410"/>
    </linearGradient>
    <radialGradient id="rv-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#031410" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rv-phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1f1a"/>
      <stop offset="100%" stop-color="#071512"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#rv-bg)"/>
  <rect width="800" height="450" fill="url(#rv-glow)"/>

  <!-- Left floating OCR scan card -->
  <g transform="translate(64, 128)">
    <rect width="190" height="118" rx="16" fill="#062920" fill-opacity="0.85" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="20" y="28" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="1.2">ARCHIVIO MENSILE</text>
    <text x="20" y="56" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="24" font-weight="800">€ 428,50</text>
    <!-- Mini bar chart -->
    <rect x="20" y="82" width="18" height="18" rx="4" fill="#10b981" fill-opacity="0.4"/>
    <rect x="46" y="74" width="18" height="26" rx="4" fill="#10b981" fill-opacity="0.6"/>
    <rect x="72" y="66" width="18" height="34" rx="4" fill="#34d399"/>
    <rect x="98" y="78" width="18" height="22" rx="4" fill="#10b981" fill-opacity="0.5"/>
    <rect x="124" y="70" width="18" height="30" rx="4" fill="#10b981" fill-opacity="0.75"/>
  </g>

  <!-- Smartphone Frame (Center) -->
  <g transform="translate(284, 34)">
    <rect width="232" height="382" rx="34" fill="url(#rv-phone)" stroke="#34d399" stroke-opacity="0.45" stroke-width="2.5"/>
    <!-- Dynamic island notch -->
    <rect x="82" y="12" width="68" height="14" rx="7" fill="#020c09"/>

    <!-- App Header -->
    <text x="24" y="54" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="1.2">RECEIPTVAULT · EXPO</text>
    <text x="24" y="76" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Scontrini salvati</text>

    <!-- Receipt Item 1 -->
    <g transform="translate(18, 94)">
      <rect width="196" height="68" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <circle cx="28" cy="34" r="14" fill="#10b981" fill-opacity="0.25"/>
      <text x="28" y="38" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✓</text>
      <text x="52" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Apple Store</text>
      <text x="52" y="46" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">GARANZIA · 24 MESI</text>
      <text x="180" y="38" text-anchor="end" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">€ 249</text>
    </g>

    <!-- Receipt Item 2 -->
    <g transform="translate(18, 172)">
      <rect width="196" height="68" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="28" cy="34" r="14" fill="#10b981" fill-opacity="0.2"/>
      <text x="28" y="38" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✓</text>
      <text x="52" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">MediaWorld</text>
      <text x="52" y="46" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">ELETTRONICA · PDF</text>
      <text x="180" y="38" text-anchor="end" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12" font-weight="700">€ 89</text>
    </g>

    <!-- Receipt Item 3 -->
    <g transform="translate(18, 250)">
      <rect width="196" height="68" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="28" cy="34" r="14" fill="#10b981" fill-opacity="0.2"/>
      <text x="28" y="38" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✓</text>
      <text x="52" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Amazon EU</text>
      <text x="52" y="46" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">UFFICIO · ARCHIVIATO</text>
      <text x="180" y="38" text-anchor="end" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12" font-weight="700">€ 90</text>
    </g>

    <!-- Bottom Scan Action Bar -->
    <rect x="46" y="332" width="140" height="32" rx="16" fill="#10b981"/>
    <text x="116" y="352" text-anchor="middle" fill="#022c22" font-family="system-ui, sans-serif" font-size="11" font-weight="800">+ Scansiona scontrino</text>
  </g>

  <!-- Right floating badge -->
  <g transform="translate(546, 226)">
    <rect width="186" height="84" rx="16" fill="#062920" fill-opacity="0.85" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="20" y="30" fill="#34d399" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1.2">REACT NATIVE · TS</text>
    <text x="20" y="52" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Ricerca istantanea</text>
    <text x="20" y="69" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="10">Tag, categorie &amp; backup</text>
  </g>
</svg>
